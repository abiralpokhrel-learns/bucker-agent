name: release

# Ships the Windows installer to GitHub Releases.
# Trigger: push a tag like v2.0.0, or manual dispatch from the Actions tab.
# The installer is built fresh on a clean windows-latest runner, checksummed,
# and attached to the GitHub Release — no more "download pending".
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create/update (e.g. v2.0.0)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup uv
        uses: astral-sh/setup-uv@v3

      - name: Checkout Hermes agent (pinned)
        # Pinned to the version verified in desktop/build/runtime/inventory.json.
        # Bump together with the inventory after verifying the handshake.
        run: |
          git clone --depth 1 --branch v0.20.5 https://github.com/NousResearch/hermes-agent.git "$env:RUNNER_TEMP/hermes-agent"

      - name: Build bundled runtime
        run: |
          uv pip install --system tomli
          python desktop/packaging/build_runtime.py --hermes-source "$env:RUNNER_TEMP/hermes-agent"

      - name: Install desktop deps
        working-directory: desktop
        run: npm ci

      - name: Install frontend deps
        run: npm --prefix bucker/frontend ci

      - name: Package Windows installer
        working-directory: desktop
        run: npm run package:win

      - name: Checksums + verification note
        working-directory: desktop/release
        shell: pwsh
        run: |
          $exe = Get-ChildItem Bucker-Desktop-*-Setup.exe | Select-Object -First 1
          if (-not $exe) { throw "installer not found in desktop/release" }
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($exe.Name)" | Out-File -Encoding ascii SHA256SUMS.txt
          @"
          Bucker Desktop $($exe.BaseName) - Windows x64 developer preview
          File: $($exe.Name)
          Size: $($exe.Length) bytes
          SHA256: $hash
          Verify: certutil -hashfile $($exe.Name) SHA256  (compare to SHA256SUMS.txt)
          Note: unsigned preview build. Windows SmartScreen / Device Guard may
          warn or block it; do not bypass organizational policy.
          "@ | Out-File -Encoding utf8 VERIFICATION.txt
          Get-Content SHA256SUMS.txt
          Get-Content VERIFICATION.txt

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
          name: Bucker Desktop ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
          draft: false
          prerelease: true
          generate_release_notes: true
          files: |
            desktop/release/Bucker-Desktop-*-Setup.exe
            desktop/release/SHA256SUMS.txt
            desktop/release/VERIFICATION.txt
