name: release

# Ships the Windows installer to GitHub Releases.
# Trigger: push a tag like v2.0.0, or manual dispatch from the Actions tab.
# The installer is built fresh on a clean windows-latest runner, checksummed,
# and attached to the GitHub Release — no more "download pending".
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create/update (e.g. v2.0.0)"
        required: false
        default: ""
      hermes_ref:
        description: "Hermes source ref (commit SHA). Empty = auto-resolve 0.20.5."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup uv
        uses: astral-sh/setup-uv@v3

      - name: Checkout Hermes agent (pinned to 0.20.5 sources)
        # 0.20.5 is a source-tree version (inventory.json), NOT a git tag or a
        # PyPI release — hermes-agent tags are date-based (v2026.9.24, ...), so
        # `git clone --branch v0.20.5` fails. Resolve the commit that introduced
        # `version = "0.20.5"` in pyproject.toml instead, and verify the
        # checkout really declares it before building. Override with the
        # hermes_ref dispatch input when deliberately moving versions (then
        # re-verify the ACP handshake and bump the inventory + docs).
        shell: pwsh
        run: |
          $dest = Join-Path $env:RUNNER_TEMP "hermes-agent"
          if (Test-Path $dest) { Remove-Item -Recurse -Force $dest }
          git clone --filter=blob:none --no-checkout https://github.com/NousResearch/hermes-agent.git $dest
          Set-Location $dest
          $ref = "${{ github.event.inputs.hermes_ref }}"
          if (-not $ref) {
            $ref = git log --all -S 'version = "0.20.5"' --format=%H -- pyproject.toml | Select-Object -Last 1
            if (-not $ref) { throw "could not resolve hermes 0.20.5 sources; re-run with hermes_ref set to a commit SHA" }
            Write-Host "resolved hermes 0.20.5 sources at $ref"
          } else {
            Write-Host "using explicit hermes_ref $ref"
          }
          git checkout $ref
          if (-not "${{ github.event.inputs.hermes_ref }}") {
            $ver = git show "${ref}:pyproject.toml" | Select-String '^\s*version\s*='
            Write-Host "pyproject declares:$ver"
            if ($ver -notmatch '"0\.20\.5"') {
              throw "hermes checkout does not declare 0.20.5 — refusing to package a different agent than verified"
            }
          }

      - name: Build bundled runtime
        run: |
          uv pip install --system tomli
          python desktop/packaging/build_runtime.py --hermes-source "$env:RUNNER_TEMP/hermes-agent"

      - name: Install desktop deps
        working-directory: desktop
        run: npm ci

      - name: Install frontend deps
        run: npm --prefix bucker/frontend ci

      - name: Package Windows installer
        working-directory: desktop
        run: npm run package:win

      - name: Checksums + verification note
        working-directory: desktop/release
        shell: pwsh
        run: |
          $exe = Get-ChildItem Bucker-Desktop-*-Setup.exe | Select-Object -First 1
          if (-not $exe) { throw "installer not found in desktop/release" }
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($exe.Name)" | Out-File -Encoding ascii SHA256SUMS.txt
          @"
          Bucker Desktop $($exe.BaseName) - Windows x64 developer preview
          File: $($exe.Name)
          Size: $($exe.Length) bytes
          SHA256: $hash
          Verify: certutil -hashfile $($exe.Name) SHA256  (compare to SHA256SUMS.txt)
          Note: unsigned preview build. Windows SmartScreen / Device Guard may
          warn or block it; do not bypass organizational policy.
          "@ | Out-File -Encoding utf8 VERIFICATION.txt
          Get-Content SHA256SUMS.txt
          Get-Content VERIFICATION.txt

      - name: Upload to GitHub Release
        # github.event.inputs is null on tag-push events; indexing into null
        # yields null (no error), so this resolves to the pushed tag there
        # and to the manual input on workflow_dispatch.
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Bucker Desktop ${{ github.event.inputs.tag || github.ref_name }}
          draft: false
          prerelease: true
          generate_release_notes: true
          files: |
            desktop/release/Bucker-Desktop-*-Setup.exe
            desktop/release/SHA256SUMS.txt
            desktop/release/VERIFICATION.txt
