name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: bucker
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
      - run: uv python install 3.12
      - run: uv sync --extra dev --extra full

      - name: Lint
        run: uv run ruff check .

      - name: Guard — no hardcoded model names
        # The "LLM is a replaceable plugin" claim, enforced. Model names live in
        # config/env only; this fails the build if one leaks into the code.
        run: |
          if grep -rInE '"(gpt-[0-9a-z.-]+|claude-[0-9a-z.-]+|o[1-9]-[a-z]+)"' \
               --include='*.py' bucker/ | grep -v 'config.py'; then
            echo "::error::hardcoded model name outside config.py"
            exit 1
          fi
          echo "ok - no hardcoded model names"

      - name: Build bucker-sandbox image
        # Tests docker-run real sandbox containers; CI has no image until
        # this builds it (the local smoke run builds it on demand, CI can't).
        run: docker build -t bucker-sandbox:latest -f Dockerfile.sandbox .

      - name: Tests
        env:
          BUCKER_TEST_DATABASE_URL: postgresql://postgres:dev@localhost:5432/bucker
        run: uv run pytest tests/ --ignore=tests/crash_test.py -v

  # M1 durability gate. This job is the reason the project exists — if it goes
  # red, the core promise ("nothing is lost when it crashes") is broken and
  # nothing else matters until it is green again.
  crash-resume:
    runs-on: ubuntu-latest
    needs: test

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: bucker
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv python install 3.12
      - run: uv sync --extra dev --extra full

      - name: Install Temporal CLI
        run: |
          curl -sSf https://temporal.download/cli.sh | sh
          echo "$HOME/.temporalio/bin" >> $GITHUB_PATH

      - name: Start Temporal dev server
        run: |
          temporal server start-dev --headless &
          for i in $(seq 1 30); do
            temporal operator cluster health 2>/dev/null && break
            sleep 2
          done

      - name: Migrate
        env:
          BUCKER_DATABASE_URL: postgresql://postgres:dev@localhost:5432/bucker
        run: uv run python -m bucker.cli migrate --admin-url postgresql://postgres:dev@localhost:5432/bucker

      - name: Build bucker-sandbox image
        # The M1 crash test runs the task through a real sandbox container.
        run: docker build -t bucker-sandbox:latest -f Dockerfile.sandbox .

      - name: M1 — kill -9 mid-task, resume, zero data loss
        env:
          BUCKER_DATABASE_URL: postgresql://bucker_app:dev@localhost:5432/bucker
        run: uv run python -m tests.crash_test

  # The lite path is what a fresh user actually runs: zero infrastructure,
  # base dependencies only. This job is the regression gate for the
  # dependency split — bucker lite must work with NO temporalio/asyncpg
  # installed (bucker/temporal_compat.py + lazy imports), not just without
  # their services. If this goes red, "nothing but Python" is a lie again.
  lite-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv python install 3.12
      # Base deps ONLY — no --extra full, no dev group.
      - run: uv sync --no-group dev

      - name: Guard — the base install must not pull full-stack packages
        run: |
          uv run python - <<'EOF'
          import importlib.util as u
          for pkg in ("temporalio", "asyncpg"):
              assert u.find_spec(pkg) is None, f"{pkg} leaked into base deps"
          print("base install is light: no temporalio, no asyncpg")
          EOF

      - name: Lite smoke — boot, demo task, verify, event stream
        run: uv run python scripts/ci_lite_smoke.py

      - name: Upload lite server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lite-smoke-log
          path: lite-smoke.log

  # The Windows launcher (start.bat) is the beginner path and must work on
  # a fresh machine. start.bat itself finds/checks Python, creates .venv,
  # pip-installs, and starts bucker lite — the full double-click sequence.
  launcher-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lite smoke through the real launcher (start.bat)
        shell: pwsh
        env:
          LITE_CMD: cmd /c start.bat
        run: python scripts/ci_lite_smoke.py

      - name: Upload launcher log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: launcher-windows-log
          path: lite-smoke.log
