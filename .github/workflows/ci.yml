name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: bucker
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
      - run: uv python install 3.12
      - run: uv sync --extra dev

      - name: Lint
        run: uv run ruff check .

      - name: Guard — no hardcoded model names
        # The "LLM is a replaceable plugin" claim, enforced. Model names live in
        # config/env only; this fails the build if one leaks into the code.
        run: |
          if grep -rInE '"(gpt-[0-9a-z.-]+|claude-[0-9a-z.-]+|o[1-9]-[a-z]+)"' \
               --include='*.py' bucker/ | grep -v 'config.py'; then
            echo "::error::hardcoded model name outside config.py"
            exit 1
          fi
          echo "ok - no hardcoded model names"

      - name: Tests
        env:
          BUCKER_TEST_DATABASE_URL: postgresql://postgres:dev@localhost:5432/bucker
        run: uv run pytest tests/ --ignore=tests/crash_test.py -v

  # M1 durability gate. This job is the reason the project exists — if it goes
  # red, the core promise ("nothing is lost when it crashes") is broken and
  # nothing else matters until it is green again.
  crash-resume:
    runs-on: ubuntu-latest
    needs: test

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: bucker
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv python install 3.12
      - run: uv sync --extra dev

      - name: Install Temporal CLI
        run: |
          curl -sSf https://temporal.download/cli.sh | sh
          echo "$HOME/.temporalio/bin" >> $GITHUB_PATH

      - name: Start Temporal dev server
        run: |
          temporal server start-dev --headless &
          for i in $(seq 1 30); do
            temporal operator cluster health 2>/dev/null && break
            sleep 2
          done

      - name: Migrate
        env:
          BUCKER_DATABASE_URL: postgresql://postgres:dev@localhost:5432/bucker
        run: uv run python -m bucker.cli migrate --admin-url postgresql://postgres:dev@localhost:5432/bucker

      - name: M1 — kill -9 mid-task, resume, zero data loss
        env:
          BUCKER_DATABASE_URL: postgresql://bucker_app:dev@localhost:5432/bucker
        run: uv run python -m tests.crash_test
