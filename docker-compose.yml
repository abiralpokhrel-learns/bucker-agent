# bucker-agent full stack — the "zero local tooling" path.
#
#   docker compose up --build -d
#   open http://localhost:8123
#
# That runs Postgres + Temporal + worker + dashboard, all in containers,
# AND builds the bucker-sandbox isolation image (the `sandbox` service
# below is a build carrier: `up --build` composes it as bucker-sandbox:latest
# on the host, then the container exits — the worker launches sandboxes
# directly via the host docker socket, never through this service).
# The ONLY prerequisite on the host is Docker (Desktop). Everything else —
# Python, uv, the Temporal CLI — is no longer needed locally.

services:
  postgres:
    # Pinned by digest for reproducible infrastructure. To refresh:
    #   docker pull postgres:16 && docker inspect --format '{{index .RepoDigests 0}}' postgres:16
    image: postgres:16@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
    container_name: bucker-pg
    environment:
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: bucker
    ports:
      - "5432:5432"
    volumes:
      - bucker_pgdata:/var/lib/postgresql/data
      # Creates the extra 'temporal' database on first boot (auto-setup
      # needs it for its own schema; bucker's DB is created by POSTGRES_DB).
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bucker"]
      interval: 5s
      timeout: 5s
      retries: 10

  temporal:
    # Temporal server in a container — no Temporal CLI install needed.
    # AUTO-SETUP (proven 2026-08-05): needs a real DB, so it uses the
    # postgres service above + the init/01-databases.sql script.
    # NOTE: the dev-server web UI (:8233) is a separate image and is not
    # bundled here — bucker's own dashboard is the UI.
    image: temporalio/auto-setup:1.28.4
    container_name: bucker-temporal
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_SEEDS: postgres
      POSTGRES_USER: postgres
      POSTGRES_PWD: dev
      POSTGRES_DB: temporal
    ports:
      - "7233:7233"   # gRPC (workers + clients)
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "7233"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    container_name: bucker-api
    command: ["python", "-m", "uvicorn", "bucker.api.app:app", "--host", "0.0.0.0", "--port", "8123"]
    env_file:
      - path: .env
        required: false   # compose >= 2.24: works with NO .env (dev defaults)
    environment:
      BUCKER_DATABASE_URL: postgresql://postgres:dev@postgres:5432/bucker
      BUCKER_TEMPORAL_HOST: temporal:7233
    ports:
      - "8123:8123"
    volumes:
      - bucker_data:/data
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_healthy

  worker:
    build: .
    container_name: bucker-worker
    command: ["python", "-m", "bucker.worker"]
    env_file:
      - path: .env
        required: false
    environment:
      BUCKER_MODEL_MODE: live
      BUCKER_DATABASE_URL: postgresql://postgres:dev@postgres:5432/bucker
      BUCKER_TEMPORAL_HOST: temporal:7233
    volumes:
      - bucker_data:/data
      # Host docker socket — lets the worker launch sandbox containers.
      # Docker Desktop proxies this on Windows.
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_healthy

  # Build carrier only: makes `docker compose up --build` build the
  # isolation image the worker launches (bucker-sandbox:latest) with no
  # separate `docker build` step. The container itself exits immediately.
  sandbox:
    image: bucker-sandbox:latest
    build:
      context: .
      dockerfile: Dockerfile.sandbox
    command: ["echo", "bucker-sandbox:latest built — the worker launches this image directly via the host docker socket"]
    restart: "no"

volumes:
  bucker_pgdata:
  bucker_data:
