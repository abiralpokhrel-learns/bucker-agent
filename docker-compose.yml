# Phase 0 infrastructure. Postgres only — Temporal runs from the CLI dev server
# (`temporal server start-dev`), which is lighter and gives you the UI at :8233.
#
#   docker compose up -d
#   uv run python -m bucker.cli migrate
#
services:
  postgres:
    image: postgres:16
    container_name: bucker-pg
    environment:
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: bucker
    ports:
      - "5432:5432"
    volumes:
      - bucker_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bucker"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bucker_pgdata:
