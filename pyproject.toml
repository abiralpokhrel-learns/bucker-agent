[project]
name = "bucker-agent"
version = "0.1.0"
description = "Durable, verified agent execution. Nothing is trusted until it's verified, nothing is lost when it crashes, nothing overspends silently, nothing changes in production until it's proven better."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Baikuntha" }]
keywords = ["ai-agents", "durable-execution", "event-sourcing", "temporal", "evaluation"]

dependencies = [
    "temporalio>=1.7",
    "asyncpg>=0.29",
    "pydantic>=2.7",
    "jsonschema>=4.22",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Phase 1 onward. Kept out of the core install so Phase 0 stays lean.
llm = ["litellm>=1.40"]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[project.scripts]
bucker = "bucker.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bucker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 96
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
