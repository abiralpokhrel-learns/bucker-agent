[project]
name = "bucker-agent"
version = "0.1.0"
description = "Durable, verified agent execution. Nothing is trusted until it's verified, nothing is lost when it crashes, nothing overspends silently, nothing changes in production until it's proven better."
readme = "README.md"
requires-python = ">=3.11,<3.14"  # supported/tested: 3.11, 3.12 (see classifiers)
license = "Apache-2.0"
authors = [{ name = "Baikuntha" }]
keywords = [
    "ai-agents",
    "durable-execution",
    "event-sourcing",
    "temporal",
    "evaluation",
    "verification",
    "sandbox",
]
classifiers = [
    # Prototype until M2 (the benchmark gate) passes with live numbers; flip
    # to 4 - Beta when a paired SWE-bench evaluation is published.
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "temporalio>=1.7",
    "asyncpg>=0.29",
    "pydantic>=2.7",
    "jsonschema>=4.22",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Phase 1 onward. Kept out of the core install so Phase 0 stays lean.
llm = ["litellm>=1.40"]
# MCP server (bucker/mcp/server.py): expose verified tasks to other agents
# over the Model Context Protocol. `uv sync --extra mcp` to install.
# <2 pinned: mcp 2.x removed the FastMCP high-level API (split into a
# separate package); 1.x is the stable, documented surface.
mcp = ["mcp>=1.9,<2"]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[project.scripts]
bucker = "bucker.cli:main"

# TODO(pre-publish): swap in the real repository URL before publishing.
# The owner slug below is a pre-publish placeholder, not a real account.
[project.urls]
Homepage = "https://github.com/bucker-agent/bucker-agent"
Repository = "https://github.com/bucker-agent/bucker-agent"
Issues = "https://github.com/bucker-agent/bucker-agent/issues"
Documentation = "https://github.com/bucker-agent/bucker-agent#readme"
Changelog = "https://github.com/bucker-agent/bucker-agent/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bucker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 96
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
# Template module: long lines inside HTML/JS f-strings are inherent; the
# new-task/schedules forms use %-formatting on purpose (JS braces break
# f-strings), so UP031 is also ignored here.
"bucker/api/dashboard.py" = ["E501", "UP031"]
# Doctor's subprocess probe code is one long -c string by necessity.
"scripts/doctor.py" = ["E501"]

[dependency-groups]
dev = [
    "swebench>=4.1.0",
]
